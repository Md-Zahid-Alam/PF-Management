name: pf_tracker
description: Offline-first provident fund tracker for Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  drift_dev: ^2.34.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
