name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PF_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PF_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PF_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$PF_RELEASE_STORE_PASSWORD"
          test -n "$PF_RELEASE_KEY_ALIAS"
          test -n "$PF_RELEASE_KEY_PASSWORD"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Generate Android command-line host
        run: >-
          flutter create
          --platforms=android
          --org=com.zahidalam
          --project-name=pf_tracker
          .

      - name: Decode temporary upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pf-upload-keystore.jks"
          chmod 600 "$RUNNER_TEMP/pf-upload-keystore.jks"
          echo "PF_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/pf-upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Configure Android host and release signing
        run: dart run tool/configure_android_host.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate PF Ledger launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate localized resources
        run: flutter gen-l10n

      - name: Generate typed database sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Run static analysis
        run: flutter analyze --fatal-infos

      - name: Run automated tests
        run: flutter test --coverage

      - name: Build signed release app bundle
        run: flutter build appbundle --release

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pf-ledger-signed-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
